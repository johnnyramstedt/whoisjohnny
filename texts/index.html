<main>
  <header class="top"><a class="mark" href="/" aria-label="WhoIsJohnny? home">?</a><span class="nav"><a href="/library/">Library</a><a href="/library/#about">About</a></span></header>
  <a class="frame" id="frame" href="/library/#001" aria-label="Open this text in the library"><canvas id="imgA" class="on"></canvas><canvas id="imgB"></canvas></a>
  <div class="enterrow"><span id="num">No. 001</span><a href="/library/">Enter the library</a></div>
</main>
<script src="/assets/core.js?v=4"></script>
<script>
  (function () {
    const A = $("imgA"), B = $("imgB"), frame = $("frame"), num = $("num");
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    let i = 0, front = A, back = B, timer = null;
    const paint = (cv, k) => drawMockup(cv, TEXTS[k], 1080);
    const label = (k) => { frame.href = "/library/#" + TEXTS[k].no; num.textContent = "No. " + TEXTS[k].no + " / " + TEXTS.length; };
    function next() {
      i = (i + 1) % TEXTS.length;
      paint(back, i); back.classList.add("on"); front.classList.remove("on");
      const t = front; front = back; back = t; label(i);
    }
    const start = () => { if (!timer && !reduce) timer = setInterval(next, 5500); };
    const stop = () => { clearInterval(timer); timer = null; };
    const ready = (document.fonts && document.fonts.load) ? document.fonts.load('400 14px "Space Grotesk"') : Promise.resolve();
    ready.catch(() => {}).then(() => { paint(A, 0); label(0); start(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else start(); });
    frame.addEventListener("mouseenter", stop); frame.addEventListener("mouseleave", start);
  })();
</script>

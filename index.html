<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Registration of Arms Form</title>
<style>
  /* Layout: screen = toolbar + stack of A4 sheets (one per passenger); print = sheets only, one per page */
  :root {
    --bg: #e9ebee;
    --fg: #1d2330;
    --muted: #5d6676;
    --bar: #ffffff;
    --line: #cfd4dc;
    --accent: #1f4e8c;
    --accent-fg: #ffffff;
    --warn: #a4380f;
    --paper: #ffffff;
    --ink: #1b1b1b;
    --ink-soft: #6b6f76;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181f; --fg: #e6e9ef; --muted: #98a1b1; --bar: #1c222c; --line: #323a47;
      --accent: #7aa7e6; --accent-fg: #0d1a2e; --warn: #ff9a73;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181f; --fg: #e6e9ef; --muted: #98a1b1; --bar: #1c222c; --line: #323a47;
    --accent: #7aa7e6; --accent-fg: #0d1a2e; --warn: #ff9a73;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 "Helvetica Neue", Arial, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 48px;
  }

  /* ---------- toolbar (screen only) ---------- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  }
  .bar h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .01em; }
  .bar .hint { color: var(--muted); font-size: 12.5px; flex: 1 1 260px; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: var(--bar); color: var(--fg);
    padding: 8px 14px; border-radius: 4px;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:hover { filter: brightness(.96); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  .linkrow { width: 100%; display: none; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .linkrow.on { display: flex; }
  .linkrow input { flex: 1 1 280px; min-width: 0; font: 12.5px ui-monospace, Menlo, monospace; padding: 7px 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; }
  .linkrow .note { flex: 1 1 100%; color: var(--muted); font-size: 12px; }

  .only-edit { display: inline-block; }
  .only-view { display: none; }
  body.view .only-edit { display: none; }
  body.view .only-view { display: inline-block; }

  .sheets { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 24px; }
  .scroller { width: 100%; overflow-x: auto; display: flex; justify-content: center; }

  /* ---------- the A4 sheet ---------- */
  .sheet {
    position: relative;
    width: 210mm; min-height: 297mm;
    flex: none;
    background: var(--paper); color: var(--ink);
    padding: 12mm 14mm 10mm;
    font-family: Arial, "Helvetica Neue", sans-serif;
    box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.12);
  }
  .sheet .pax-tag { position: absolute; top: 5mm; left: 14mm; font-size: 8pt; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; }
  .sheet .remove { position: absolute; top: 4mm; right: 4mm; font-size: 12px; padding: 4px 9px; background: #fff; color: #333; border-color: #c9c9c9; }
  body.view .sheet .remove { display: none; }
  body.view .sheet input, body.view .sheet textarea { pointer-events: none; }

  .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8mm; padding-bottom: 3mm; border-bottom: 1px solid #bbb; }
  .brand { font-weight: 800; font-style: italic; font-size: 19pt; letter-spacing: .02em; color: #555; }
  .title { font-size: 15pt; text-align: center; letter-spacing: .01em; }
  .formno { font-size: 6.5pt; text-align: right; line-height: 1.25; color: #333; }
  .formno b { font-weight: 700; }

  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5mm; margin-top: 5mm; }
  .box { border: 1px solid #555; padding: 1.6mm 2.2mm; min-height: 17mm; display: flex; flex-direction: column; }
  .box.span2 { grid-column: span 2; }
  .box label, .lbl { font-weight: 700; font-size: 9pt; color: #777; }
  .box input { border: 0; background: transparent; font: 11pt Arial, sans-serif; color: var(--ink); padding: 1mm 0 0; width: 100%; outline-offset: 3px; }
  .sheet input, .sheet textarea { color: var(--ink); }

  h3.u { font-size: 10.5pt; font-weight: 700; color: #777; text-decoration: underline; margin: 6mm 0 3mm; }
  .lines { display: grid; grid-template-columns: 38mm 1fr; align-items: end; row-gap: 2.6mm; column-gap: 4mm; }
  .lines .lbl { padding-bottom: 1mm; }
  .line { border: 0; border-bottom: 1px solid #666; background: transparent; font: 11pt Arial, sans-serif; padding: 1mm 0 .5mm; width: 100%; border-radius: 0; }

  .ammo { display: grid; grid-template-columns: 1fr 70mm; gap: 4mm; align-items: start; }
  .ammo .rows { display: grid; grid-template-columns: 1fr 24mm 10mm; align-items: end; row-gap: 3.5mm; column-gap: 3mm; margin-left: -2mm; }
  .ammo .rows .lbl { text-align: left; }
  .ammo .rows span.kg { font-weight: 700; font-size: 9pt; color: #777; padding-bottom: 1mm; }
  .warn { color: var(--warn); font-size: 9pt; font-weight: 700; margin-top: 2mm; display: none; }
  .warn.on { display: block; }

  .permit { display: grid; grid-template-columns: 64mm 1fr; gap: 0 4mm; margin-top: 0; }
  .checks { display: grid; grid-template-columns: 48mm 6mm; align-items: center; row-gap: 0; }
  .checks .lbl { height: 6mm; display: flex; align-items: center; }
  .checks .cell { height: 6mm; border: 1px solid #555; border-top-width: 0; display: flex; align-items: center; justify-content: center; }
  .checks .cell:nth-of-type(1) { border-top-width: 1px; }
  .checks input { appearance: none; -webkit-appearance: none; width: 100%; height: 100%; margin: 0; background: transparent; display: grid; place-content: center; cursor: pointer; }
  .checks input:checked::after { content: "\2713"; font-size: 11pt; font-weight: 700; color: #111; line-height: 1; }
  .remarks { border: 1px solid #555; padding: 1.6mm 2.2mm; display: flex; flex-direction: column; min-height: 30mm; }
  .remarks textarea { flex: 1; border: 0; background: transparent; resize: none; font: 10.5pt Arial, sans-serif; padding-top: 1mm; width: 100%; }

  .notice { border: 1px solid #555; margin-top: 6mm; padding: 2mm 4mm 3mm; }
  .notice .a { font-size: 6.6pt; font-weight: 700; text-align: center; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 1.6mm; margin-bottom: 2mm; }
  .notice .b { font-size: 6.6pt; font-weight: 700; line-height: 1.32; color: #222; text-align: justify; }

  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 12mm; margin-top: 9mm; font-size: 10.5pt; color: #777; }
  .sign div { padding-bottom: 14mm; border-bottom: 1px solid #666; }
  .page { text-align: right; font-size: 9pt; margin-top: 8mm; color: #222; }

  @media (max-width: 820px) {
    .scroller { display: block; }
    .sheet { margin-inline: auto; }
  }

  /* ---------- print ---------- */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff !important; padding: 0 !important; }
    .bar, .remove { display: none !important; }
    .sheets { display: block; padding: 0; gap: 0; }
    .scroller { display: block; overflow: visible; }
    .sheet {
      width: 210mm; height: 296mm; min-height: 0; box-shadow: none; margin: 0;
      break-after: page; page-break-after: always; overflow: hidden;
    }
    .scroller:last-child .sheet { break-after: auto; page-break-after: auto; }
    .warn { display: none !important; }
    input, textarea { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .checks input:checked::after { color: #000; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Registration of Arms Form</h1>
  <div class="hint" id="hint"></div>
  <div class="actions">
    <button id="add" type="button" class="only-edit">+ Add passenger</button>
    <button id="clear" type="button" class="only-edit">Clear all</button>
    <button id="share" type="button" class="only-edit">Copy link to filled forms</button>
    <button id="editcopy" type="button" class="only-view">Edit a copy</button>
    <button id="print" type="button" class="primary">Save as PDF / Print</button>
  </div>
  <div class="linkrow" id="linkrow">
    <input id="linkout" type="text" readonly aria-label="Link to the filled forms">
    <span class="note" id="linknote"></span>
  </div>
</div>

<main class="sheets" id="sheets"></main>

<template id="tpl">
  <div class="scroller">
  <section class="sheet">
    <span class="pax-tag"></span>
    <button class="remove" type="button">Remove</button>

    <div class="head">
      <div class="brand">FLEXFLIGHT</div>
      <div class="title">REGISTRATION OF ARMS FORM</div>
      <div class="formno"><b>FORM NO:</b> FLX SE 008<br><b>REVISION NUMBER:</b> 01<br><b>REVISION DATE:</b>16.11.2023</div>
    </div>

    <div class="grid4">
      <div class="box"><label>Date:</label><input data-f="date" type="date"></div>
      <div class="box"><label>Commander:</label><input data-f="commander" type="text" autocomplete="off"></div>
      <div class="box"><label>Flight No:</label><input data-f="flight" type="text" autocomplete="off"></div>
      <div class="box"><label>Aircraft:</label><input data-f="aircraft" type="text" autocomplete="off"></div>

      <div class="box"><label>Airport:</label><input data-f="airport" type="text" autocomplete="off"></div>
      <div class="box"><label>Time of Dep:</label><input data-f="dep" type="text" placeholder="HH:MM" autocomplete="off"></div>
      <div class="box"><label>Destination:</label><input data-f="dest" type="text" autocomplete="off"></div>
      <div class="box"><label>Time of Arr:</label><input data-f="arr" type="text" placeholder="HH:MM" autocomplete="off"></div>

      <div class="box span2"><label>Passenger Name</label><input class="p-name" type="text" autocomplete="off"></div>
      <div class="box"><label>Passport No:</label><input class="p-pass" type="text" autocomplete="off"></div>
      <div class="box"><label>Nationality:</label><input class="p-nat" type="text" autocomplete="off"></div>
    </div>

    <h3 class="u">Type of Weapon:</h3>
    <div class="lines">
      <span class="lbl">Rifle Type &amp; No:</span><input class="line" type="text">
      <span class="lbl">Shotgun Type &amp; No:</span><input class="line" type="text">
      <span class="lbl">Pistol Type &amp; No:</span><input class="line" type="text">
      <span class="lbl">Revolver Type &amp; No:</span><input class="line" type="text">
      <span class="lbl">Other Type &amp; No:</span><input class="line" type="text">
    </div>

    <div class="ammo" style="margin-top:7mm">
      <h3 class="u" style="margin:0">Ammunition (max 5 kgs)</h3>
      <div class="rows">
        <span class="lbl">Rifle Ammunition:</span><input class="line am" type="text" inputmode="decimal"><span class="kg">Kgs.</span>
        <span class="lbl">Shotgun Ammunition:</span><input class="line am" type="text" inputmode="decimal"><span class="kg">Kgs.</span>
        <span class="lbl">Other:</span><input class="line am" type="text" inputmode="decimal"><span class="kg">Kgs.</span>
      </div>
    </div>
    <div class="warn">Total ammunition is over 5 kgs.</div>

    <h3 class="u" style="margin-top:6mm">Valid firearms permit (mark below)</h3>
    <div class="permit">
      <div class="checks">
        <span class="lbl">ID Issued by Police:</span><span class="cell"><input type="checkbox" aria-label="ID Issued by Police"></span>
        <span class="lbl">ID Issued by Military:</span><span class="cell"><input type="checkbox" aria-label="ID Issued by Military"></span>
        <span class="lbl">Export Certificate:</span><span class="cell"><input type="checkbox" aria-label="Export Certificate"></span>
        <span class="lbl">Declaration of Firearms:</span><span class="cell"><input type="checkbox" aria-label="Declaration of Firearms"></span>
        <span class="lbl">EU Firearms Passport:</span><span class="cell"><input type="checkbox" aria-label="EU Firearms Passport"></span>
      </div>
      <div class="remarks"><label class="lbl">Remarks:</label><textarea></textarea></div>
    </div>

    <div class="notice">
      <div class="a">In case of illegal possession of firearms, special report is to be completed and the police shall be contacted.</div>
      <div class="b">Flexflight Operational Department will complete the registration of firearms, upon which security staff must be contacted to avail himself at the check-in counter in the departure/arrival terminal. From this point the passengers incl. his/hers baggage and firearms are to be accompanied by the staff of security into the transit area, where security will perform a precautionary check of the passengers his/hers luggage, firearms and ammunition, as well as his/hers permission to carry firearms. ALL HUNTING WEAPONS MUST BE TRANSPORTED AS CHECKED-IN BAGGAGE ONLY. WEAPONS, AMMUNITION ETC. MAY ONLY BE TRANSPORTED BY THE AIRLINE WHEN LOADED SO THAT NO PERSON DURING THE FLIGHT CAN HAVE UNHINDERED ACCESS TO IT.</div>
    </div>

    <div class="sign"><div>Signed by Airline / Handling Agent</div><div>Signed by Airport Security.</div></div>
    <div class="page">Page <b>1</b> of <b>1</b></div>
  </section>
  </div>
</template>

<script>
(function () {
  var FLIGHT = ['date','commander','flight','aircraft','airport','dep','dest','arr'];
  var STORE = 'halvett-arms-draft';
  var host = document.getElementById('sheets');
  var tpl = document.getElementById('tpl');
  var hint = document.getElementById('hint');
  var shared = {};
  var viewMode = false;
  FLIGHT.forEach(function (k) { shared[k] = ''; });

  function sheets() { return host.querySelectorAll('.sheet'); }

  /* ---------- read / write form state ---------- */
  function vals(s, sel) { return Array.prototype.map.call(s.querySelectorAll(sel), function (e) { return e.value; }); }
  function readSheet(s) {
    return {
      n: s.querySelector('.p-name').value,
      pp: s.querySelector('.p-pass').value,
      na: s.querySelector('.p-nat').value,
      w: vals(s, '.lines .line'),
      a: vals(s, '.am'),
      c: Array.prototype.map.call(s.querySelectorAll('.checks input'), function (e) { return e.checked ? 1 : 0; }),
      r: s.querySelector('textarea').value
    };
  }
  function collect() {
    return { f: shared, p: Array.prototype.map.call(sheets(), readSheet) };
  }
  function setList(list, arr) { (arr || []).forEach(function (v, i) { if (list[i]) list[i].value = v; }); }
  function fillSheet(s, p) {
    if (!p) return;
    s.querySelector('.p-name').value = p.n || '';
    s.querySelector('.p-pass').value = p.pp || '';
    s.querySelector('.p-nat').value = p.na || '';
    setList(s.querySelectorAll('.lines .line'), p.w);
    setList(s.querySelectorAll('.am'), p.a);
    var cb = s.querySelectorAll('.checks input');
    (p.c || []).forEach(function (v, i) { if (cb[i]) cb[i].checked = !!v; });
    s.querySelector('textarea').value = p.r || '';
    checkAmmo(s);
  }

  /* ---------- link encoding (data lives after the #, never sent to the server) ---------- */
  function b64u(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64u(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function encode(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) {
      var cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z.' + b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
    }
    return 'r.' + b64u(bytes);
  }
  async function decode(str) {
    var kind = str.slice(0, 2), bytes = unb64u(str.slice(2));
    if (kind === 'z.') {
      var ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(ds).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  /* ---------- sheets ---------- */
  function renumber() {
    var all = sheets(), n = all.length;
    Array.prototype.forEach.call(all, function (s, i) {
      s.querySelector('.pax-tag').textContent = 'Passenger ' + (i + 1) + ' of ' + n;
      s.querySelector('.remove').disabled = n === 1;
    });
    if (viewMode) hint.textContent = n + (n === 1 ? ' passenger' : ' passengers') + '. Press Save as PDF / Print to get one A4 sheet per passenger.';
  }

  function checkAmmo(sheet) {
    var sum = 0;
    sheet.querySelectorAll('.am').forEach(function (el) {
      var v = parseFloat(String(el.value).replace(',', '.'));
      if (!isNaN(v)) sum += v;
    });
    sheet.querySelector('.warn').classList.toggle('on', sum > 5);
  }

  function addSheet(p) {
    var frag = tpl.content.cloneNode(true);
    var wrap = frag.querySelector('.scroller');
    var sheet = wrap.querySelector('.sheet');
    FLIGHT.forEach(function (k) { sheet.querySelector('[data-f="' + k + '"]').value = shared[k]; });
    fillSheet(sheet, p);
    sheet.querySelector('.remove').addEventListener('click', function () {
      if (sheets().length > 1) { wrap.remove(); renumber(); save(); }
    });
    host.appendChild(wrap);
    renumber();
    return sheet;
  }

  /* ---------- draft kept in this browser only ---------- */
  var saveTimer = null;
  function save() {
    if (viewMode) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORE, JSON.stringify(collect())); } catch (e) {}
    }, 250);
  }

  function onEdit(e) {
    var t = e.target;
    if (t.dataset && t.dataset.f) {
      shared[t.dataset.f] = t.value;
      host.querySelectorAll('[data-f="' + t.dataset.f + '"]').forEach(function (el) { if (el !== t) el.value = t.value; });
    }
    if (t.classList.contains('am')) checkAmmo(t.closest('.sheet'));
    save();
  }
  host.addEventListener('input', onEdit);
  host.addEventListener('change', onEdit);

  /* ---------- buttons ---------- */
  document.getElementById('add').addEventListener('click', function () {
    var s = addSheet();
    save();
    s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    s.querySelector('.p-name').focus({ preventScroll: true });
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (!window.confirm('Remove all passengers and flight details from this page?')) return;
    FLIGHT.forEach(function (k) { shared[k] = ''; });
    host.innerHTML = '';
    addSheet();
    try { localStorage.removeItem(STORE); } catch (e) {}
    document.getElementById('linkrow').classList.remove('on');
  });

  document.getElementById('share').addEventListener('click', async function () {
    var btn = this, label = btn.textContent;
    var token = await encode(collect());
    var url = location.href.split('#')[0].split('?')[0] + '#d=' + token;
    var out = document.getElementById('linkout');
    out.value = url;
    document.getElementById('linknote').textContent =
      'Anyone with this link can read all details on the forms, including passport numbers. The link is ' + url.length + ' characters long. If a messaging app cuts it, send the PDF instead.';
    document.getElementById('linkrow').classList.add('on');
    out.focus(); out.select();
    function done() { btn.textContent = 'Link copied'; setTimeout(function () { btn.textContent = label; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () {});
    }
  });

  document.getElementById('editcopy').addEventListener('click', function () {
    viewMode = false;
    document.body.classList.remove('view');
    hint.textContent = EDIT_HINT;
    history.replaceState(null, '', location.href.split('#')[0]);
    save();
  });

  var baseTitle = document.title;
  window.addEventListener('beforeprint', function () {
    var parts = ['Arms-form'];
    if (shared.flight) parts.push(shared.flight);
    if (shared.date) parts.push(shared.date);
    document.title = parts.join('_').replace(/[^\w.\-]+/g, '-');
  });
  window.addEventListener('afterprint', function () { document.title = baseTitle; });
  document.getElementById('print').addEventListener('click', function () { window.print(); });

  /* ---------- start ---------- */
  var EDIT_HINT = 'Fill in the flight details once, they copy to every passenger. Your entries are kept in this browser while you work. To save a PDF, press the blue button and choose "Save as PDF" as the printer.';
  hint.textContent = EDIT_HINT;

  function load(data) {
    shared = {};
    FLIGHT.forEach(function (k) { shared[k] = (data.f && data.f[k]) || ''; });
    host.innerHTML = '';
    (data.p && data.p.length ? data.p : [null]).forEach(function (p) { addSheet(p); });
  }

  (async function init() {
    var h = location.hash;
    if (h.indexOf('#d=') === 0) {
      try {
        load(await decode(h.slice(3)));
        viewMode = true;
        document.body.classList.add('view');
        renumber();
        return;
      } catch (e) {
        hint.textContent = 'This link could not be read. Ask the sender for a new link or a PDF.';
      }
    }
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) { load(JSON.parse(raw)); return; }
    } catch (e) {}
    addSheet();
  })();
})();
</script>
</body>
</html>
